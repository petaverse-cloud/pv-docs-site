<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wagguracy - Redirecting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --error-accent: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing background shapes */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.6;
        }
        .glow-1 {
            width: 300px;
            height: 300px;
            background: #4f46e5;
            top: 20%;
            left: 20%;
            animation: float 10s ease-in-out infinite alternate;
        }
        .glow-2 {
            width: 250px;
            height: 250px;
            background: #06b6d4;
            bottom: 20%;
            right: 20%;
            animation: float 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            padding: 2.5rem;
            border-radius: 24px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                        0 0 50px var(--accent-glow);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Brand Logo or Icon placeholder */
        .icon-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            position: relative;
        }

        .icon-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3.5px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* Error state styles */
        .container.error {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                        0 0 50px var(--error-glow);
            border-color: rgba(244, 63, 94, 0.2);
        }

        .container.error .icon-container {
            background: linear-gradient(135deg, var(--error-accent) 0%, #e11d48 100%);
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4);
        }

        /* Custom SVG icons inside logo container */
        .logo-svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .badge-list {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .badge-item svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>

    <div class="container" id="app-card">
        <div class="icon-container" id="icon-box">
            <div class="spinner" id="loading-spinner"></div>
            <svg id="error-icon" class="logo-svg" style="display: none;" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
        </div>

        <h1 class="title" id="card-title">Redirecting to App Store</h1>
        <p class="subtitle" id="card-desc">Detecting your device type to redirect you to the official Wagguracy download page, please wait...</p>

        <div class="badge-list" id="badge-area">
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.523 15.3l1.816 3.146a.5.5 0 0 1-.183.683l-.683.393a.5.5 0 0 1-.683-.183l-1.83-3.172c-2.31 1.258-5.183 1.258-7.493 0L6.82 19.34a.5.5 0 0 1-.683.183l-.683-.393a.5.5 0 0 1-.183-.683L7.087 15.3C4.12 13.3 2.128 10.024 2.003 6.305h18.604c-.125 3.72-2.116 6.995-5.084 8.995zM7.5 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm7 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
                </svg>
                Android
            </div>
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.57 2.95-1.39z"/>
                </svg>
                iOS
            </div>
        </div>

        <div class="footer">Wagguracy App Distribution Portal</div>
    </div>

    <script>
        (function() {
            const androidUrl = "https://play.google.com/store/apps/details?id=com.wagguracy.app";
            const iosUrl = "https://apps.apple.com/us/app/wagguracy/id6776070186";

            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(ua);
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

            const card = document.getElementById('app-card');
            const title = document.getElementById('card-title');
            const desc = document.getElementById('card-desc');
            const spinner = document.getElementById('loading-spinner');
            const errorIcon = document.getElementById('error-icon');

            if (isAndroid) {
                setTimeout(() => {
                    window.location.href = androidUrl;
                }, 800);
            } else if (isIOS) {
                setTimeout(() => {
                    window.location.href = iosUrl;
                }, 800);
            } else {
                // Show unsupported device warning
                setTimeout(() => {
                    spinner.style.display = 'none';
                    errorIcon.style.display = 'block';
                    card.classList.add('error');
                    title.innerText = "Device Not Supported";
                    desc.innerText = "We apologize, but Wagguracy is currently only supported on Android or iOS mobile devices. Please visit this page using a mobile phone or tablet.";
                }, 500);
            }
        })();
    </script>
</body>
</html>
